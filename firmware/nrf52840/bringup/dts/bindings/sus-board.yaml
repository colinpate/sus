description: Board-level controls for the SUS sensor firmware

compatible: "zephyr,user"

properties:
  vperiph-en-gpios:
    type: phandle-array
    required: true
    description: GPIO that enables the switched peripheral rail.

  flash-cs-gpios:
    type: phandle-array
    required: true
    description: GPIO used as the external SPI flash chip select.
