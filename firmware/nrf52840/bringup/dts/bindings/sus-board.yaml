description: GPIO assignments for the SUS custom board bringup app

compatible: "zephyr,user"

properties:
  vperiph-en-gpios:
    type: phandle-array
    required: true
    description: GPIO that enables the switched peripheral rail.

  flash-cs-gpios:
    type: phandle-array
    required: true
    description: SPI flash chip-select GPIO.

  imu-int-gpios:
    type: phandle-array
    required: true
    description: LSM6DSO INT1 GPIO.

  i2c-sda-gpios:
    type: phandle-array
    required: true
    description: I2C SDA GPIO used for raw line-level diagnostics.

  i2c-scl-gpios:
    type: phandle-array
    required: true
    description: I2C SCL GPIO used for raw line-level diagnostics.

  flash-sck-gpios:
    type: phandle-array
    required: true
    description: SPI flash clock GPIO used for raw line-level diagnostics.

  flash-miso-gpios:
    type: phandle-array
    required: true
    description: SPI flash MISO GPIO used for raw line-level diagnostics.

  flash-mosi-gpios:
    type: phandle-array
    required: true
    description: SPI flash MOSI GPIO used for raw line-level diagnostics.
