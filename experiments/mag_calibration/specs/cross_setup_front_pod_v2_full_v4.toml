schema_version = 1
experiment_type = "cross_log"
name = "cross-setup-front-pod-v2-full-v4"
pipeline = "front"
time_basis = "active"
training_window = "full_log"
evaluation_window = "full_log"
include_diagonal = true
trainers = ["self-supervised", "oracle-power", "oracle-binned-median"]
oracle_bins = 100

# Complete usable pod-v2 cohort from front-default on 2026-09-20. Pod-v1
# Stumpjumper logs are intentionally excluded. The seven Slayer derived chunks
# represent five parent recordings and are parent-balanced during analysis.
# This revision reruns the frozen v3 cohort after merging the 200 Hz/front
# pipeline changes; self-supervised training now applies the production bad mask.
cohort = "front-default, usable, pod_version=2"
cohort_date = "2026-09-20"

logs = [
  # Specialized Stumpjumper, pod v2
  "log-0046",
  "log-0048",
