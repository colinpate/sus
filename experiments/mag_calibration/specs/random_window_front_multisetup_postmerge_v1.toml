  "log-0078-valid",
  "log-0080-valid",
  "log-0081",
  "log-0098",
  "log-0099",

  # Transition TR11 2025, pod v2 (Harry)
  "log-0113",
  "log-0115",
  "log-0116",
  "log-0122",
  "log-0129",

  # Rocky Mountain Slayer, pod v2; one chunk per parent recording
  "log-0145-filtered-c01",
  "log-0147-filtered-c02",
  "log-0151-filtered-c01",
  "log-0152-filtered-c01",
  "log-0155-filtered-c01",
]

[setup_logs]
tr11_pod_v2 = ["log-0078-valid", "log-0080-valid", "log-0081", "log-0098", "log-0099"]
tr11_2025_pod_v2 = ["log-0113", "log-0115", "log-0116", "log-0122", "log-0129"]
